# nginx front for the Docker sandbox agent.
#
# The Caddyfile in README.md is the shorter way to say this; nginx is what a
# Linux box with certbot already has. Either way the agent speaks plain HTTP on
# loopback and the terminator owns TLS and the public name.
#
#   install -m 644 agent/nginx/opencode-sandbox-agent.conf \
#     /etc/nginx/sites-available/opencode-sandbox-agent
#   ln -sf ../sites-available/opencode-sandbox-agent /etc/nginx/sites-enabled/
#   # replace SERVER_NAME first, then let certbot add the TLS lines:
#   certbot --nginx -d sandbox.example.com
#
# Everything below the proxy_pass exists for one route:
# `/sessions/:id/proxy/event` is the SSE stream the site's transcript mirror
# lives on. It can be silent for hours between turns and must arrive frame by
# frame. A buffered or reaped stream does not fail loudly — it shows up as a
# session that keeps forgetting it was listening, the mirror falling back to
# polling, and the transcript's `reason` no longer saying `live`.

server {
	server_name SERVER_NAME;
	listen 80;

	# The protocol's write batches carry file contents inline. The default 1m
	# would turn a large write into a 413 the site reports as a host error.
	client_max_body_size 100m;

	location / {
		proxy_pass http://127.0.0.1:8787;

		# HTTP/1.1 with no Connection header is what keeps the upstream
		# connection alive; the default 1.0 would close it per request and
		# take the stream with it.
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;

		# The two that decide whether SSE works at all.
		proxy_buffering off;
		proxy_cache off;

		# nginx has no "no timeout": these are the longest silence a live
		# stream may contain. A day is longer than any session stays up
		# without the site touching it — the idle stop comes first.
		proxy_read_timeout 1d;
		proxy_send_timeout 1d;
		proxy_connect_timeout 10s;

		# The site sends `Authorization: Bearer` on every request, including
		# /healthz. Nothing here inspects it: an unauthenticated probe is the
		# agent's own 401, deliberately, so it cannot learn that this box runs
		# sessions.
	}
}
