<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The phone is a first-class surface, so the viewport is pinned before
         anything else and `viewport-fit` lets the layout reach the safe areas. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- The browser chrome follows the palette the page is actually wearing. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#262624" />
    <!-- Inline so the tab has an icon without a request. The stock UI used to
         answer /favicon.ico from a container, which is gone with it. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f92040'/%3E%3Cg fill='white'%3E%3Ccircle cx='11.6' cy='15.4' r='6.2'/%3E%3Ccircle cx='19.1' cy='13.6' r='7'/%3E%3Ccircle cx='24.3' cy='18.9' r='4.2'/%3E%3Ccircle cx='8.1' cy='19.9' r='4.6'/%3E%3Crect x='8.1' y='15.4' width='16.2' height='10'/%3E%3C/g%3E%3Cg fill='none' stroke='%23f92040' stroke-width='3.8' stroke-linecap='round'%3E%3Cpath d='M16 12.6V22.2'/%3E%3Cpath d='M16 15.8C16 19.4 9.8 18.6 9.8 22.2'/%3E%3Cpath d='M16 15.8C16 19.4 22.2 18.6 22.2 22.2'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>Cloud Agents</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
