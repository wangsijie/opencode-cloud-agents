<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The phone is a first-class surface, so the viewport is pinned before
         anything else and `viewport-fit` lets the layout reach the safe areas. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- The browser chrome follows the palette the page is actually wearing. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf9f5" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#262624" />
    <!-- Inline so the tab has an icon without a request. The stock UI used to
         answer /favicon.ico from a container, which is gone with it. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f92040'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='white' stroke-width='4'/%3E%3C/svg%3E"
    />
    <title>OpenCode Hub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
