name: Deploy

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # The sandbox-host decision below diffs this push against its
          # predecessor.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm run typecheck

      # `opencode-sandbox-host` is a second Worker: the Cloudflare
      # implementation of the sandbox host protocol, which owns the session
      # containers. It is deployed before the site because the site's service
      # binding must never point at a Worker that does not exist yet, and only
      # when something it is built from changed — its Dockerfile, its own
      # sources, or the protocol both sides share.
      - name: Decide whether the sandbox host is affected
        id: host
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BEFORE}" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Previous commit ${BEFORE} is unavailable; deploying the sandbox host too."
            echo "affected=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          changed="$(git diff --name-only "${BEFORE}" "${GITHUB_SHA}" -- Dockerfile docker host protocol)"
          if [ -n "${changed}" ]; then
            echo "Sandbox host paths changed:"
            echo "${changed}"
            echo "affected=true" >> "${GITHUB_OUTPUT}"
          else
            echo "No sandbox host path changed; leaving it deployed as it is."
            echo "affected=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Deploy the sandbox host
        if: steps.host.outputs.affected == 'true'
        run: pnpm run deploy:host
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The site itself runs no containers any more: they all belong to the
      # sandbox host, which is deployed above and rolls out on its own paths.
      # So there is nothing here to decide — no image is built from this
      # configuration, and every push deploys the Worker.
      - name: Deploy to Cloudflare
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
